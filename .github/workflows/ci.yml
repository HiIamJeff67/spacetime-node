name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  module-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go vet ./...
