name: spacetime-node

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s
x-dependency-env: &dependency-env
  KAFKA_BROKERS: kafka:9092
  POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: redis:6379
  CLICKHOUSE_DSN: clickhouse://clickhouse:9000/default
  QDRANT_URL: http://qdrant:6333
  LLM_MODE: ${LLM_MODE:-template}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-demo-hash-v1}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-32}
  EMBEDDING_COLLECTION: ${EMBEDDING_COLLECTION:-offer_embeddings_v1}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-lgtm:4317

services:
  gateway:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      <<: *dependency-env
      SERVICE_NAME: gateway-service
      HTTP_ADDR: :8000
      GRPC_ADDR: :9000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MOBILITY_API_URL: ${MOBILITY_API_URL:-http://mobility:8001}
      MOBILITY_API_TIMEOUT_MS: ${MOBILITY_API_TIMEOUT_MS:-800}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
      mobility:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"

  mobility:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mobility
    environment:
      <<: *dependency-env
      SERVICE_NAME: mobility-service
      HTTP_ADDR: :8001
      GRPC_ADDR: :9001
      BEACON_API_URL: ${BEACON_API_URL:-}
      BEACON_API_USERNAME: ${BEACON_API_USERNAME:-}
      BEACON_API_PASSWORD: ${BEACON_API_PASSWORD:-}
      BEACON_API_TIMEOUT_MS: ${BEACON_API_TIMEOUT_MS:-800}
    depends_on:
      otel-lgtm:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:9001:9001"

  recommendation:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: recommendation
    environment:
      <<: *dependency-env
      SERVICE_NAME: recommendation-service
      HTTP_ADDR: :8002
      GRPC_ADDR: :9002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  embedding-indexer:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: embedding-indexer
    environment:
      <<: *dependency-env
      SERVICE_NAME: embedding-indexer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  notification:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    environment:
      <<: *dependency-env
      SERVICE_NAME: notification-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started

  analytics:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: analytics
    environment:
      <<: *dependency-env
      SERVICE_NAME: analytics-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  redemption:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: redemption
    environment:
      <<: *dependency-env
      SERVICE_NAME: redemption-service
      HTTP_ADDR: :8003
      GRPC_ADDR: :9003
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    ports:
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:9003:9003"

  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1 FROM users LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.4.5-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic journey.entered.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recommendation.created.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.sent.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.delivered.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.failed.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recommendation.impressed.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recommendation.clicked.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic recommendation.dismissed.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic redemption.succeeded.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic merchant.verified.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic visit.attributed.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic offer.changed.v1 --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq.v1 --partitions 3 --replication-factor 1

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9004:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
      - ../clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'DESCRIBE TABLE product_events' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      clickhouse:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  otel-lgtm:
    image: grafana/otel-lgtm@sha256:bb182ac3174a20923fa58f00d1790fa71eb06cc0150078c0b0e8feb9e6611492
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - otel-lgtm-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
  grafana-data:
  otel-lgtm-data:
  qdrant-data:
