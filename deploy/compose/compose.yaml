name: spacetime-node

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - ../../.env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_started
    clickhouse:
      condition: service_started
    qdrant:
      condition: service_started
x-dependency-env: &dependency-env
  KAFKA_BROKERS: kafka:9092
  POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: redis:6379
  CLICKHOUSE_DSN: clickhouse://clickhouse:9000/default
  QDRANT_URL: http://qdrant:6333
  LLM_MODE: ${LLM_MODE:-template}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}

services:
  gateway:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      <<: *dependency-env
      SERVICE_NAME: gateway-service
      HTTP_ADDR: :8000
      GRPC_ADDR: :9000
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"

  mobility:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mobility
    environment:
      <<: *dependency-env
      SERVICE_NAME: mobility-service
      HTTP_ADDR: :8001
      GRPC_ADDR: :9001
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:9001:9001"

  recommendation:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: recommendation
    environment:
      <<: *dependency-env
      SERVICE_NAME: recommendation-service
      HTTP_ADDR: :8002
      GRPC_ADDR: :9002
    ports:
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:9002:9002"

  redemption:
    <<: *app-common
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: redemption
    environment:
      <<: *dependency-env
      SERVICE_NAME: redemption-service
      HTTP_ADDR: :8003
      GRPC_ADDR: :9003
    ports:
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:9003:9003"

  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4.5-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9004:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
  qdrant-data:
