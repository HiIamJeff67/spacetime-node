syntax = "proto3";

package spacetime_node.v1;

option go_package = "spacetime-node/api/proto/spacetime_node/v1;v1";

import "api/proto/spacetime_node/v1/common.proto";
import "google/api/annotations.proto";

service JourneyService {
  // CreateEntryEvent starts the demo journey and asynchronously triggers recommendation.
  rpc CreateEntryEvent(CreateEntryEventRequest) returns (CreateEntryEventResponse) {
    option (google.api.http) = {
      post: "/v1/entry-events"
      body: "*"
    };
  }

  // GetLatestRecommendation returns the latest recommendation for a journey.
  rpc GetLatestRecommendation(GetLatestRecommendationRequest) returns (GetLatestRecommendationResponse) {
    option (google.api.http) = {get: "/v1/recommendations/latest"};
  }

  // RecordRecommendationEvent records browser engagement for analytics attribution.
  rpc RecordRecommendationEvent(RecordRecommendationEventRequest) returns (RecordRecommendationEventResponse) {
    option (google.api.http) = {
      post: "/v1/recommendation-events"
      body: "*"
    };
  }
}

message CreateEntryEventRequest {
  RequestContext request_context = 1;
  string user_id_hash = 2;
  string station_id = 3;
  string line_id = 4;
  string position_id = 5;
  BeaconObservation beacon = 6;
}

message BeaconObservation {
  string uuid = 1;
  int64 major = 2;
  int64 minor = 3;
  int32 power = 4;
}

message CreateEntryEventResponse {
  string journey_id = 1;
}

message GetLatestRecommendationRequest {
  RequestContext request_context = 1;
  string journey_id = 2;
}

message GetLatestRecommendationResponse {
  string recommendation_id = 1;
  string journey_id = 2;
  string offer_id = 3;
  string title = 4;
  string body = 5;
  repeated string reasons = 6;
  string copy_source = 7;
  int64 decision_latency_ms = 8;
  repeated RecommendationCandidate candidates = 9;
  // Ranked, eligible offers for the client surface. The legacy top-level
  // fields remain the best offer for existing clients.
  repeated RecommendedOffer offers = 10;
}

message RecordRecommendationEventRequest {
  RequestContext request_context = 1;
  string user_id_hash = 2;
  string recommendation_id = 3;
  string event_type = 4;
  string offer_id = 5;
  string surface = 6;
}

message RecordRecommendationEventResponse {
  string event_id = 1;
}

// RecommendationCandidate exposes the explainable boundary between vector recall and rule validation.
message RecommendationCandidate {
  string offer_id = 1;
  double vector_score = 2;
  double rule_score = 3;
  bool eligible = 4;
  repeated string reasons = 5;
}

message RecommendedOffer {
  string offer_id = 1;
  string title = 2;
  string body = 3;
  repeated string reasons = 4;
  double score = 5;
  int64 points_cost = 6;
  string station_id = 7;
}
